services:
  api:
    build: .
    env_file: .env
    environment:
      # inside docker, "localhost" means the container itself, so this points at Ollama on the host machine
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
    volumes:
      - ./data:/app/data
      # model downloads are cached here so they survive rebuilds
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ui:
    build: .
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  hf-cache:
