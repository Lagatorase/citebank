name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # I install CPU-only torch first so pip doesn't pull the multi-GB CUDA wheels for sentence-transformers
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # the tests use the fictional demo reports, a hashing embedder and a stub LLM, so they need no models or keys
      - name: Run tests
        run: pytest -q
